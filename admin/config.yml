backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "posts"
    label: "Posts"
    folder: "posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"

      - label: "Featured Image"
        name: "image"
        widget: "image"
        required: false

      - label: "Publish Date"
        name: "date"
        widget: "datetime"

      - label: "Post"
        name: "body"
        widget: "markdown"
